<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89F535" />
      <stop offset="100%" stop-color="#55D418" />
    </linearGradient>
    <linearGradient id="alarmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#D70015" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect / app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Timer Ring Track -->
  <circle cx="256" cy="276" r="160" fill="none" stroke="#2C2C2E" stroke-width="26" />

  <!-- Neon Green Active Arc -->
  <path d="M 256 116 A 160 160 0 1 1 142.8 389.2" fill="none" stroke="url(#neonGreen)" stroke-width="26" stroke-linecap="round" />

  <!-- Stopwatch top button / crown -->
  <rect x="232" y="56" width="48" height="36" rx="10" fill="#E5E5EA" />
  <rect x="216" y="44" width="80" height="18" rx="8" fill="#8E8E93" />

  <!-- Plus symbol in center with neon gradient -->
  <rect x="234" y="196" width="44" height="160" rx="14" fill="url(#neonGreen)" />
  <rect x="176" y="254" width="160" height="44" rx="14" fill="url(#neonGreen)" />

  <!-- Accent mini dot -->
  <circle cx="360" cy="180" r="14" fill="url(#alarmRed)" />
</svg>

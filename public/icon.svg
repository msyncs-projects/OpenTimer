<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c14" />
      <stop offset="60%" stop-color="#0a0c0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed true black & subtle center glow background (no rounded corners so OS masks smoothly) -->
  <rect width="512" height="512" fill="#000000" />
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Outer Dial Track -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#222722" stroke-width="14" />

  <!-- Luminous Countdown Arc -->
  <path d="M 256 88 A 168 168 0 1 1 124 360" fill="none" stroke="url(#neonLime)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />

  <!-- Stopwatch / Interval tick markers around dial -->
  <g stroke="#3f4a3f" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="102" x2="256" y2="114" />
    <line x1="410" y1="256" x2="398" y2="256" />
    <line x1="256" y1="410" x2="256" y2="398" />
    <line x1="102" y1="256" x2="114" y2="256" />
  </g>

  <!-- Cyan accent pulse dot at current interval position -->
  <circle cx="124" cy="360" r="10" fill="url(#neonCyan)" filter="url(#glow)" />

  <!-- Athletic Plus Emblem in Center -->
  <g filter="url(#glow)">
    <rect x="236" y="176" width="40" height="160" rx="20" fill="url(#neonLime)" />
    <rect x="176" y="236" width="160" height="40" rx="20" fill="url(#neonLime)" />
  </g>
</svg>
